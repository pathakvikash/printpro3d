name: CI
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SITE_URL: http://localhost:3000 # placeholder, build only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26 # engines is >=22.18; matches Vercel's default
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm test
      - run: npm run build # catches Turbopack-only failures before Vercel
